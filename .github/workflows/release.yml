name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Compile check
        shell: bash
        run: python3 -m py_compile scripts/*.py

      - name: Skill structure validation
        shell: bash
        run: python3 scripts/validate_skill.py

      - name: Unit tests
        shell: bash
        run: python3 -m unittest discover tests -v

  create-release:
    name: Create Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Pack skill archive (.skill)
        shell: bash
        run: |
          set -euo pipefail
          SKILL_NAME="${GITHUB_REPOSITORY##*/}"
          OUT="${SKILL_NAME}.skill"
          zip -r "$OUT" . \
            -x '.git/*' \
            -x '.github/*' \
            -x '.gitignore' \
            -x 'specmark/*' \
            -x 'logs/*' \
            -x '*/__pycache__/*' \
            -x '*.pyc'
          echo "packed ${OUT}"
          ls -lh "$OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2（SHA 钉版）
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          files: ${{ github.event.repository.name }}.skill
